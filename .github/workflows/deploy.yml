name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-port-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-port-app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE: ${{ secrets.VITE_EMAILJS_SERVICE }}
          VITE_EMAILJS_TEMPLATE: ${{ secrets.VITE_EMAILJS_TEMPLATE }}
          VITE_EMAILJS_KEY: ${{ secrets.VITE_EMAILJS_KEY }}
      # Pages has no SPA fallback for project subpaths; create 404.html and admin/index.html.
      - run: cp dist/index.html dist/404.html && mkdir -p dist/admin && cp dist/index.html dist/admin/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: my-port-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
